[package]
name = "devknx"
version = "0.1.0"
edition = "2024"
authors = ["Fabian Schmieder"]
description = "KNX monitor with CLI, TUI, GUI, REST, and MCP interfaces"
license = "GPL-3.0-only"
repository = "https://github.com/metaneutrons/devknx"
publish = false
build = "build.rs"

[package.metadata.deb]
maintainer = "Fabian Schmieder <metaneutrons@users.noreply.github.com>"
section = "utils"
priority = "optional"
assets = [
    ["target/release/devknx", "usr/bin/", "755"],
    ["LICENSE", "usr/share/doc/devknx/LICENSE", "644"],
    ["THIRD-PARTY-NOTICES.md", "usr/share/doc/devknx/THIRD-PARTY-NOTICES.md", "644"],
    ["licenses/Hack.txt", "usr/share/doc/devknx/licenses/Hack.txt", "644"],
    ["licenses/OFL-1.1.txt", "usr/share/doc/devknx/licenses/OFL-1.1.txt", "644"],
    ["licenses/UFL-1.0.txt", "usr/share/doc/devknx/licenses/UFL-1.0.txt", "644"],
    ["licenses/emoji-icon-font-MIT.txt", "usr/share/doc/devknx/licenses/emoji-icon-font-MIT.txt", "644"],
]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# GUI platform crates pull in parallel dependency generations that cannot be
# unified by this application without upstream changes.
multiple_crate_versions = "allow"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
crossterm = { version = "0.29", optional = true }
csv = "1.4"
futures-core = "0.3"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
interprocess = { version = "2.4.4", features = ["tokio"] }
knx-rs-core = "0.10.1"
knx-rs-ip = "0.10.1"
quick-xml = "0.42"
ratatui = { version = "0.30", optional = true }
rfd = { version = "0.17.2", optional = true, default-features = false, features = ["xdg-portal"] }
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[features]
default = ["gui", "tui"]
gui = ["dep:eframe", "dep:image", "dep:chrono", "dep:rfd"]
tui = ["dep:ratatui", "dep:crossterm", "dep:chrono"]
full = ["gui", "tui"]

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }
widestring = "1"
windows-permissions = "0.2.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
